<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>LEDゲーム</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;font-family:sans-serif;touch-action:manipulation;overflow:hidden}
html{background:#a3172a}
:fullscreen::backdrop{background:#a3172a}
body{display:flex;flex-direction:column;position:fixed;left:0;right:0;top:0;bottom:0;height:auto}
#pl1{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.pl{flex:1;display:flex;gap:6px;padding:6px;position:relative;overflow:hidden}
.deco{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;gap:2vmin;font-size:12vmin;pointer-events:none;overflow:hidden}
.xmas .deco{display:flex}
.xmas #pl2{background:linear-gradient(#0f1a48,#2a3b78 80%)}
.xmas #pl1{background:#a3172a;flex:2}
.xmas #pl2{flex:4}
#pl2 .deco{transform:rotate(180deg)}
.deco span{display:inline-block;animation:sway 1.6s ease-in-out infinite alternate}
.lt{animation:twk 1.2s steps(1) infinite}
@keyframes twk{0%{opacity:1}50%{opacity:.12}}
.deco i{z-index:5;position:absolute;top:-6vmin;font-style:normal;font-size:4vmin;color:#fff;animation:fall linear infinite}
@keyframes sway{from{transform:translateY(-1.5vmin) rotate(-8deg)}to{transform:translateY(1.5vmin) rotate(8deg)}}
@keyframes fall{to{transform:translateY(70vh) rotate(360deg)}}
.gift{position:absolute;width:7vmin;height:6vmin;line-height:6vmin;text-align:center;font-size:3.8vmin;font-weight:bold;color:#fff;background:linear-gradient(135deg,#ff4f9a,#6f5cff);border-radius:1vmin;border:.4vmin solid #ffe066;box-sizing:border-box;line-height:5.2vmin}
.gift:before{content:'';position:absolute;left:50%;top:-1.8vmin;width:3.6vmin;height:1.8vmin;margin-left:-1.8vmin;background:#ffe066;border-radius:50% 50% 0 0}
.hs{position:absolute;left:0;right:0;top:0;bottom:0}
.hs svg{position:absolute;left:0;bottom:0;width:100%;height:auto}
.win{animation:glow 3s ease-in-out infinite alternate}
.star{animation:glow 2s ease-in-out infinite alternate}
.smk{animation:smoke 4s linear infinite}
@keyframes glow{from{opacity:1}to{opacity:.7}}
@keyframes smoke{from{transform:translateY(0);opacity:.8}to{transform:translateY(-22px);opacity:0}}
.sl{position:absolute;left:50%;top:26%;white-space:nowrap;font-size:9vmin;line-height:1;will-change:transform}
.deco .sl span{animation:none}
.deco .sl span.p{animation:bob .9s ease-in-out infinite alternate}
.deco span.nt{font-size:14vmin;font-weight:bold;line-height:1;animation:none}
@keyframes bob{from{transform:translateY(-.7vmin)}to{transform:translateY(.7vmin)}}
#pl2{transform:rotate(180deg);background:#0b2a80}
#pl1{background:#7a0e0e}
.k{flex:1;border:0;border-radius:14px;color:#fff;font-size:7vmin;font-weight:bold;touch-action:none}
.k.c{flex:2}
#pl1 .k{background:#e61e1e}
#pl2 .k{background:#1e62ff}
.k:active{filter:brightness(1.5)}
.k.h{visibility:hidden}
#mid{background:#fff;padding:6px;text-align:center}
#msg{font-size:5vmin;font-weight:bold;margin:2px 0;min-height:7vmin}
#sc{font-size:6vmin;font-weight:bold}
#msg:empty{display:none}
#menu{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px;margin:6px 0}
#menu button{font-size:6.5vmin;line-height:1.2;white-space:pre-line;padding:12px 4px;border-radius:12px;border:2px solid #888;background:#eee;font-weight:bold}
#menu button.on{background:#ffcc00;border-color:#c90}
#vm{display:none;width:72vmin;height:72vmin;margin:4px auto;border-radius:2vmin;background:#000}
#sz{margin:12px 0}
#sz button{font-size:9vmin;padding:16px 20px;margin:0 8px;border-radius:14px;border:3px solid #888;background:#eee;font-weight:bold}
#sz button.on{background:#9fd8ff;border-color:#39c}@keyframes blink{50%{opacity:.3}}
#go{font-size:13vmin;padding:10px 40px;margin:6px 0;border-radius:24px;border:0;background:#2aa84a;color:#fff;font-weight:bold;animation:blink 1s infinite}
#qt{font-size:3.5vmin;padding:4px 14px;border-radius:14px;border:1px solid #888;background:#eee}
#pl2{--ox:1vmin}
#menu #g5{font-size:5.4vmin}
/* 横向き: 青を左、赤を右に置き、真ん中にゲームを出す。青は回転させない */
@media (orientation:landscape){
body{flex-direction:row}
.pl{flex:1 1 0;min-width:0;flex-wrap:wrap;align-content:stretch}
#pl2{transform:none;--ox:.42vmin}
#pl2 .deco{transform:none}
#pl1{padding-bottom:6px}
.xmas #pl1,.xmas #pl2{flex:1 1 0}
.k{flex:1 1 40%;font-size:6vmin;min-width:0}
.k.c{order:-1;flex:1 1 100%}
.k.h{display:none}
#mid{flex:0 0 54%;overflow:auto;padding:4px;display:flex;flex-direction:column;justify-content:center}
#go,#qt{align-self:center}
#menu #g5{font-size:3.7vmin}
#msg{font-size:5vmin;min-height:0}
#sc{font-size:5vmin}
#vm{width:62vmin;height:62vmin;margin:2px auto}
#menu{grid-template-columns:1fr 1fr 1fr;margin:3px 0}
#menu button{font-size:4.6vmin;padding:6px 2px}
#go{font-size:9vmin;padding:2px 30px;margin:2px 0}
#qt{font-size:4vmin;padding:2px 12px}
#sz{margin:6px 0}
#sz button{font-size:7vmin;padding:6px 12px;margin:0 4px}
.sl{font-size:6vmin}
.deco span.nt{font-size:8vmin}
.deco{gap:0}
}
</style></head><body>
<div class="pl" id="pl2"><button class="k" id="k20"></button><button class="k c" id="k21"></button><button class="k" id="k22"></button></div>
<div id="mid">
  <div id="msg">…</div>
  <div id="sc"></div>
  <canvas id="vm" width="320" height="320"></canvas>
  <div id="menu"></div>
  <div id="sz"><button id="w8">8×8</button><button id="w10">10×10</button><button id="w0" style="margin-top:10px">LEDなし</button></div>
  <button id="go">スタート</button><button id="qt">やめる</button>
</div>
<div class="pl" id="pl1"><button class="k" id="k10"></button><button class="k c" id="k11"></button><button class="k" id="k12"></button></div>
<script>
// ESP32なし版のゲームエンジン。esp32_game6.ino のゲーム処理をJavaScriptに移したもの。
// 画面(ページ)はESP32版と同じものを使い、ESP32への通信だけをここで受け止める。
(function () {
  var W = 8, NUM = W * W, ECOLS = W - 2, UNITS = 32;
  var MENU = 0, COUNT = 1, PLAY = 2, END = 3;
  var mode = MENU, g = 0, tMode = 0, sc = [0, 0, 0], winner = 0, msg = '', lab = ['', '', ''];
  var px = [];
  function clearAll() { px = []; for (var i = 0; i < NUM * 3; i++) px.push(0); }
  clearAll();
  function ms() { return Date.now() - T0; }
  var T0 = Date.now();
  function rnd(a, b) { return b === undefined ? Math.floor(Math.random() * a) : a + Math.floor(Math.random() * (b - a)); }
  function setPx(c, r, R, G, B) {
    if (c < 0 || c >= W || r < 0 || r >= W) return;
    var i = (r * W + c) * 3; px[i] = R; px[i + 1] = G; px[i + 2] = B;
  }
  function fillAll(R, G, B) { for (var c = 0; c < W; c++) for (var r = 0; r < W; r++) setPx(c, r, R, G, B); }
  function setP(c, r, p, dim) { if (dim === undefined) dim = 255; if (p === 1) setPx(c, r, dim, 0, 0); else setPx(c, r, 0, 0, dim); }
  function ring(p) {
    for (var i = 0; i < W; i++) {
      if (p) { setP(i, 0, p); setP(i, W - 1, p); setP(0, i, p); setP(W - 1, i, p); }
      else { setPx(i, 0, 255, 255, 255); setPx(i, W - 1, 255, 255, 255); setPx(0, i, 255, 255, 255); setPx(W - 1, i, 255, 255, 255); }
    }
  }
  function endGame(w) {
    winner = w; mode = END; tMode = ms();
    msg = w === 0 ? 'ひきわけ!' : (w === 1 ? 'あかの かち!' : 'あおの かち!');
    lab = ['', '', ''];
  }
  function winByScore() { return sc[1] > sc[2] ? 1 : (sc[2] > sc[1] ? 2 : 0); }

  // 0 れんだで たいけつ
  var tpos;
  var tug = {
    init: function () { tpos = 16; msg = 'れんだ! れんだ!'; lab = ['', 'ポン!', '']; },
    input: function (p, b) {
      if (b !== 1) return;
      if (p === 1) tpos++; else tpos--;
      if (tpos >= UNITS) endGame(1); else if (tpos <= 0) endGame(2);
    },
    tick: function () {},
    render: function () {
      var bc = Math.floor(tpos * W / UNITS);
      for (var c = 0; c < W; c++) for (var r = 0; r < W; r++) {
        if (c < bc) setP(c, r, 1); else if (c > bc) setP(c, r, 2); else setPx(c, r, 255, 255, 255);
      }
    }
  };

  // 1 ぴったり ストップ
  var sround, sx = [0, 0, 0], sdone = [0, 0, 0], ssub, sw, sStart, sTsub;
  function dotX(now) { var span = 2 * (W - 1), m = Math.floor((now - sStart) / (150 - sround * 35)) % span; return m < W ? m : span - m; }
  function stopDist(x) { return x <= W / 2 - 1 ? W / 2 - 1 - x : x - W / 2; }
  function stopNewRound() { sdone = [0, 0, 0]; ssub = 0; sStart = ms(); sw = 0; msg = 'ラウンド ' + (sround + 1) + ' / 3  まんなかで ストップ!'; }
  var stop = {
    init: function () { sround = 0; lab = ['', 'ストップ!', '']; stopNewRound(); },
    input: function (p, b) {
      if (b !== 1 || ssub !== 0 || sdone[p]) return;
      sdone[p] = 1; sx[p] = dotX(ms());
      if (sdone[1] && sdone[2]) {
        var d1 = stopDist(sx[1]), d2 = stopDist(sx[2]);
        sw = d1 < d2 ? 1 : (d2 < d1 ? 2 : 0);
        if (sw) sc[sw]++;
        ssub = 1; sTsub = ms();
        msg = sw === 0 ? 'どうてん!' : (sw === 1 ? 'あかが ちかい!' : 'あおが ちかい!');
      }
    },
    tick: function () {
      if (ssub === 1 && ms() - sTsub > 1800) {
        sround++;
        if (sround >= 3) endGame(winByScore()); else stopNewRound();
      }
    },
    render: function () {
      var now = ms(), c, i;
      for (c = 0; c < W; c++) { setP(c, W - 1, 1, 25); setP(c, 0, 2, 25); }
      for (i = 0; i < sc[1]; i++) setP(i, W / 2 - 1, 1);
      for (i = 0; i < sc[2]; i++) setP(i, W / 2, 2);
      setPx(W / 2 - 1, W - 2, 255, 200, 0); setPx(W / 2, W - 2, 255, 200, 0);
      setPx(W / 2 - 1, 1, 255, 200, 0); setPx(W / 2, 1, 255, 200, 0);
      var blink = Math.floor(now / 150) % 2;
      for (var p = 1; p <= 2; p++) {
        var row = p === 1 ? W - 3 : 2, x = sdone[p] ? sx[p] : dotX(now);
        if (sdone[p]) {
          if (ssub === 1 && sw === p && blink) setPx(x, row, 255, 255, 0); else setPx(x, row, 255, 255, 255);
        } else setP(x, row, p);
      }
    }
  };

  // 2 クイズあて / 3 どっちが おおい?
  var qn, qtype, qans, qwin, qsub, qcol, qsh, qlock = [0, 0, 0], qT, dots = [];
  var COLN = ['あか', 'あお', 'きいろ', 'みどり', 'しろ'];
  var COLV = [[255, 0, 0], [0, 0, 255], [255, 200, 0], [0, 255, 0], [255, 255, 255]];
  var SHN = ['ハート', 'ほし', 'しかく', 'さんかく', 'まる'];
  var SHB = [[0x66, 0xFF, 0xFF, 0xFF, 0x7E, 0x3C, 0x18, 0x00], [0x18, 0x18, 0x7E, 0xFF, 0x7E, 0x3C, 0x66, 0x42],
    [0x00, 0x7E, 0x7E, 0x7E, 0x7E, 0x7E, 0x7E, 0x00], [0x18, 0x18, 0x3C, 0x3C, 0x7E, 0x7E, 0xFF, 0xFF],
    [0x3C, 0x7E, 0xFF, 0xFF, 0xFF, 0xFF, 0x7E, 0x3C]];
  function clearDots() { dots = []; for (var i = 0; i < NUM; i++) dots.push(false); }
  function quizNew() {
    qtype = rnd(3); qsub = 0; qlock = [0, 0, 0]; qwin = 0; qT = ms();
    var K = qtype === 1 ? 9 : 5, off = qtype === 1 ? 1 : 0, cor = qtype === 1 ? rnd(1, 9) : rnd(5);
    var v = [cor, 0, 0], i, j;
    for (i = 1; i < 3; i++) { var dup; do { v[i] = off + rnd(K); dup = false; for (j = 0; j < i; j++) if (v[j] === v[i]) dup = true; } while (dup); }
    qans = rnd(3);
    var t = v[0]; v[0] = v[qans]; v[qans] = t;
    for (i = 0; i < 3; i++) lab[i] = qtype === 0 ? COLN[v[i]] : (qtype === 2 ? SHN[v[i]] : v[i] + ' こ');
    if (qtype === 0) { qcol = cor; msg = 'もんだい ' + (qn + 1) + ': なにいろ？'; }
    else if (qtype === 1) {
      clearDots();
      for (var n = 0; n < cor;) { var c = rnd(NUM); if (!dots[c]) { dots[c] = true; n++; } }
      msg = 'もんだい ' + (qn + 1) + ': いくつ あるかな？';
    } else { qsh = cor; msg = 'もんだい ' + (qn + 1) + ': なんの かたち？'; }
  }
  var quiz = {
    init: function () { qn = 0; quizNew(); },
    input: function (p, b) {
      if (qsub !== 0 || qlock[p]) return;
      if (b === qans) { sc[p]++; qwin = p; qsub = 1; qT = ms(); msg = 'せいかい! こたえは ' + lab[qans]; }
      else {
        qlock[p] = 1;
        if (qlock[1] && qlock[2]) { qsub = 1; qT = ms(); qwin = 0; msg = 'ざんねん… こたえは ' + lab[qans]; }
      }
    },
    tick: function () { if (qsub === 1 && ms() - qT > 1800) { qn++; if (qn >= 5) endGame(winByScore()); else quizNew(); } },
    render: function () {
      var i, r, c;
      if (qtype === 0) fillAll(COLV[qcol][0], COLV[qcol][1], COLV[qcol][2]);
      else if (qtype === 1) { for (i = 0; i < NUM; i++) if (dots[i]) setPx(i % W, Math.floor(i / W), 255, 200, 0); }
      else { for (r = 0; r < 8; r++) for (c = 0; c < 8; c++) if (SHB[qsh][r] & (0x80 >> c)) setPx(c, r, 255, 80, 160); }
      if (qsub === 1 && Math.floor(ms() / 150) % 2) ring(qwin);
    }
  };
  function moreNew() {
    qsub = 0; qlock = [0, 0, 0]; qwin = 0; qT = ms();
    var small = rnd(2, 13), big = small + rnd(1, 4), leftBig = rnd(2) === 1;
    var mL = leftBig ? big : small, mR = leftBig ? small : big, n, c, r;
    qans = leftBig ? 0 : 2;
    clearDots();
    for (n = 0; n < mL;) { c = rnd(W / 2); r = rnd(W); if (!dots[r * W + c]) { dots[r * W + c] = true; n++; } }
    for (n = 0; n < mR;) { c = W / 2 + rnd(W / 2); r = rnd(W); if (!dots[r * W + c]) { dots[r * W + c] = true; n++; } }
    lab = ['あか', '', 'あお'];
    msg = 'だい ' + (qn + 1) + ' もん: どっちが おおい？';
  }
  var more = {
    init: function () { qn = 0; moreNew(); },
    input: function (p, b) {
      if (b === 1 || qsub !== 0 || qlock[p]) return;
      if (b === qans) { sc[p]++; qwin = p; qsub = 1; qT = ms(); msg = 'せいかい!'; }
      else {
        qlock[p] = 1;
        if (qlock[1] && qlock[2]) { qsub = 1; qT = ms(); qwin = 0; msg = 'ざんねん…'; }
      }
    },
    tick: function () { if (qsub === 1 && ms() - qT > 1500) { qn++; if (qn >= 7) endGame(winByScore()); else moreNew(); } },
    render: function () {
      var blink = Math.floor(ms() / 150) % 2, i, r;
      for (i = 0; i < NUM; i++) if (dots[i]) {
        var c = i % W, row = Math.floor(i / W), side = c < W / 2 ? 0 : 2;
        if (qsub === 1 && side === qans && blink) setPx(c, row, 255, 255, 255);
        else if (c < W / 2) setP(c, row, 1); else setP(c, row, 2);
      }
      if (qsub === 1 && qwin) { for (r = 0; r < W; r++) { setP(W / 2 - 1, r, qwin, 40); setP(W / 2, r, qwin, 40); } }
    }
  };

  // 4 ピンポン
  var pp = [0, 0, 0], bx, by, bdx, bdy, rally, tBall, tServe;
  function pongServe(loser) {
    bx = W / 2 - 1 + rnd(2); by = W / 2 - 1 + rnd(2);
    bdx = rnd(2) ? 1 : -1; bdy = loser === 1 ? 1 : -1;
    rally = 0; tServe = ms() + 900; tBall = tServe;
  }
  function pongScore(w) { sc[w]++; if (sc[w] >= 3) endGame(w); else pongServe(w === 1 ? 2 : 1); }
  function pongEdge(p, nx) { if (nx === pp[p]) bdx = -1; else if (nx === pp[p] + 2) bdx = 1; }
  var pong = {
    init: function () { pp = [0, (W - 3) >> 1, (W - 3) >> 1]; lab = ['◀', '', '▶']; msg = 'さきに 3てん!'; pongServe(rnd(1, 3)); },
    input: function (p, b) { if (b === 0 && pp[p] > 0) pp[p]--; else if (b === 2 && pp[p] < W - 3) pp[p]++; },
    tick: function () {
      var now = ms();
      if (now < tServe) return;
      var interval = Math.max(110, 300 - rally * 14);
      if (now - tBall < interval) return;
      tBall = now;
      var nx = bx + bdx; if (nx < 0 || nx > W - 1) { bdx = -bdx; nx = bx + bdx; }
      var ny = by + bdy;
      if (ny <= 0) {
        if (nx >= pp[2] && nx <= pp[2] + 2) { bdy = 1; ny = by + 1; rally++; pongEdge(2, nx); } else { pongScore(1); return; }
      } else if (ny >= W - 1) {
        if (nx >= pp[1] && nx <= pp[1] + 2) { bdy = -1; ny = by - 1; rally++; pongEdge(1, nx); } else { pongScore(2); return; }
      }
      bx = nx; by = ny;
    },
    render: function () {
      var i;
      for (i = 0; i < 3; i++) { setP(pp[1] + i, W - 1, 1); setP(pp[2] + i, 0, 2); }
      for (i = 0; i < sc[1]; i++) setP(0, W - 2 - i, 1, 60);
      for (i = 0; i < sc[2]; i++) setP(W - 1, 1 + i, 2, 60);
      if (ms() >= tServe || Math.floor(ms() / 120) % 2) setPx(bx, by, 255, 255, 255);
    }
  };

  // 5 インベーダー
  var cx = [0, 0, 0], bulX = [0, 0, 0], bulY = [0, -1, -1], ex, ey, edir, killed, alive, tEn, tBul, tShot = [0, 0, 0];
  function invHit(p) {
    if (bulY[p] < 0) return;
    var r = bulY[p] - ey, c = bulX[p] - ex;
    if (r >= 0 && r < 3 && c >= 0 && c < ECOLS && alive[r][c]) {
      alive[r][c] = false; bulY[p] = -1; sc[p]++; killed++;
      if (killed >= 3 * ECOLS) endGame(winByScore());
    }
  }
  var inv = {
    init: function () {
      cx = [0, W - 3, 2]; bulY = [0, -1, -1]; ex = 1; ey = 0; edir = 1; killed = 0; alive = [];
      for (var r = 0; r < 3; r++) { alive.push([]); for (var c = 0; c < ECOLS; c++) alive[r].push(true); }
      tEn = tBul = ms() + 600;
      lab = ['◀', 'うつ!', '▶']; msg = 'たくさん たおした ほうが かち!';
    },
    input: function (p, b) {
      if (b === 0 && cx[p] > 0) cx[p]--;
      else if (b === 2 && cx[p] < W - 1) cx[p]++;
      else if (b === 1 && bulY[p] < 0 && ms() - tShot[p] > 250) { bulX[p] = cx[p]; bulY[p] = W - 2; tShot[p] = ms(); invHit(p); }
    },
    tick: function () {
      var now = ms(), p;
      if (now >= tBul) {
        tBul = now + 80;
        for (p = 1; p <= 2; p++) if (bulY[p] >= 0) { bulY[p]--; invHit(p); }
      }
      if (mode !== PLAY) return;
      if (now >= tEn) {
        tEn = now + Math.max(160, 650 - killed * 22);
        if ((edir > 0 && ex + ECOLS - 1 >= W - 1) || (edir < 0 && ex <= 0)) { edir = -edir; ey++; } else ex += edir;
        for (var r = 0; r < 3; r++) for (var c = 0; c < ECOLS; c++) if (alive[r][c] && ey + r >= W - 1) { endGame(winByScore()); msg = 'インベーダーが きた! ' + msg; return; }
        invHit(1); invHit(2);
      }
    },
    render: function () {
      var a = Math.floor(ms() / 400) % 2, r, c, p;
      for (r = 0; r < 3; r++) for (c = 0; c < ECOLS; c++) if (alive[r][c]) {
        if (r === 0) setPx(ex + c, ey + r, 255, a ? 60 : 0, a ? 255 : 120);
        else if (r === 1) setPx(ex + c, ey + r, 0, 255, a ? 0 : 120);
        else setPx(ex + c, ey + r, a ? 255 : 200, 200, 0);
      }
      for (p = 1; p <= 2; p++) {
        setP(cx[p], W - 1, p);
        if (cx[p] > 0) setP(cx[p] - 1, W - 1, p, 60);
        if (cx[p] < W - 1) setP(cx[p] + 1, W - 1, p, 60);
        if (bulY[p] >= 0) setPx(bulX[p], bulY[p], p === 1 ? 255 : 150, 150, p === 1 ? 150 : 255);
      }

  var GAMES = [tug, stop, quiz, more, pong, inv];

  var DIGIT = [[6, 9, 9, 9, 9, 6], [2, 6, 2, 2, 2, 7], [6, 9, 1, 2, 4, 15], [6, 9, 2, 1, 9, 6]];
  var CDCOL = [[255, 255, 255], [0, 255, 0], [255, 200, 0], [255, 0, 0]];
  function drawDigit(n) {
    for (var r = 0; r < 6; r++) for (var c = 0; c < 4; c++)
      if (DIGIT[n][r] & (8 >> c)) setPx(2 + c, 1 + r, CDCOL[n][0], CDCOL[n][1], CDCOL[n][2]);
  }
  function periPx(i, R, G, B) {
    var s = W - 1;
    if (i < s) setPx(i, 0, R, G, B);
    else if (i < 2 * s) setPx(s, i - s, R, G, B);
    else if (i < 3 * s) setPx(s - (i - 2 * s), s, R, G, B);
    else setPx(0, s - (i - 3 * s), R, G, B);
  }
  function render() {
    var now = ms();
    clearAll();

      var el = now - tMode, n = Math.max(1, 3 - Math.floor(el / 1000));
      drawDigit(n);
      var peri = 4 * (W - 1), lit = peri - Math.floor((el % 1000) * peri / 1000);
      for (var i = peri - lit; i < peri; i++) periPx(i, CDCOL[n][0] >> 1, CDCOL[n][1] >> 1, CDCOL[n][2] >> 1);
    } else if (mode === PLAY && now - tMode < 300) {
      drawDigit(0); ring(0);
    } else if (mode === PLAY) {
      GAMES[g].render();
    }
  }

  // ページへマス目を渡す(ESP32版の通信と同じ形。1マス16進3文字)
  var stream = null, HEX = '0123456789abcdef';
  window.EventSource = function () { stream = this; };
  function sendFrame() {
    if (!stream || !stream.onmessage) return;
    var s = W + ':';
    for (var i = 0; i < NUM * 3; i++) s += HEX[px[i] >> 4];
    stream.onmessage({ data: s });
  }

  // ページからの通信(ESP32版と同じ呼び方)をここで受ける
  function route(url) {
    var q = url.split('?'), path = q[0], a = {};
    (q[1] || '').split('&').forEach(function (kv) { var e = kv.split('='); a[e[0]] = e[1]; });
    if (path === '/t') {
      if (mode === PLAY) {
        var p = parseInt(a.p, 10), b = parseInt(a.b, 10);
        if ((p === 1 || p === 2) && b >= 0 && b <= 2) GAMES[g].input(p, b);
      }
    } else if (path === '/start') {
      if (mode === MENU || mode === END) {
        sc = [0, 0, 0]; winner = 0; GAMES[g].init();
        playMsg = msg;  // ゲームの最初の文(問題文など)は、カウントダウンのあとに出す
        mode = COUNT; tMode = ms(); msg = 'よういー…';
      }
    } else if (path === '/g') {
      var n = parseInt(a.n, 10);
      if ((mode === MENU || mode === END) && n >= 0 && n < 6) { g = n; mode = MENU; msg = ''; lab = ['', '', '']; }
    } else if (path === '/menu') {
      mode = MENU; msg = 'ゲームを えらんでね'; lab = ['', '', ''];
    } else if (path === '/s') {
      return {
        m: mode, c: mode === COUNT ? Math.max(0, 3000 - (ms() - tMode)) : 0, w: W, v: 1, g: g,
        s1: sc[1], s2: sc[2], msg: msg, l: lab.slice()
      };
    }
    return 'ok';
  }
  window.fetch = function (url) {
    var v = route(url);
    return Promise.resolve({ json: function () { return Promise.resolve(v); }, text: function () { return Promise.resolve(String(v)); } });
  };

  var lastDraw = 0, playMsg = '';
  setInterval(function () {
    var now = ms();
    if (mode === COUNT && now - tMode >= 3000) { mode = PLAY; tMode = now; msg = playMsg; }
    if (mode === PLAY) GAMES[g].tick();
    if (now - lastDraw >= 33) {
      lastDraw = now;
      if (mode === COUNT || mode === PLAY) { render(); sendFrame(); }
    }
  }, 10);
})();
